[workspace]
resolver = "2"
members = ["crates/lwe-core"]
default-members = ["crates/lwe-core"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Living World Engine contributors"]

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
