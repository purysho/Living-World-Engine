[workspace]
resolver = "2"
members = ["crates/lwe-core", "crates/lwe-server", "apps/desktop/src-tauri"]
default-members = ["crates/lwe-core", "crates/lwe-server"]

[workspace.package]
version = "0.3.0"
edition = "2021"

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
