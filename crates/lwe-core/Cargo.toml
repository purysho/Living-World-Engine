[package]
name = "lwe-core"
version.workspace = true
edition.workspace = true
publish = false
description = "Living World Engine: authoritative event-sourced world state, simulation, rules and AI gateway"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
